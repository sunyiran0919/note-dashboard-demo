  <style>

    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}.app{display:flex;min-height:100vh}.sidebar{width:224px;flex:none;background:#fff;border-right:1px solid #e7ebf0;position:sticky;top:0;height:100vh;overflow:auto;scrollbar-width:thin}.brand{height:105px;padding:25px 28px 20px;border-bottom:1px solid #edf0f3;display:flex;gap:11px;align-items:flex-start}.brand-mark{width:31px;height:34px;border-radius:9px;background:var(--blue);color:white;font-size:13px;font-weight:800;display:grid;place-items:center;box-shadow:0 5px 11px #b7c5d8}.brand-title{font-weight:750;font-size:17px;line-height:1.3}.brand-en{font-size:10px;color:#a4adb8;line-height:1.45;margin-top:3px}.nav{padding:24px 17px 32px}.nav-group{margin:8px 0 27px}.group-head{height:55px;display:flex;align-items:center;gap:13px;padding:0 15px;border-radius:8px;font-weight:650;font-size:14px;color:#485872}.group-head.active{background:#edf1f6;color:#314b6d;border-left:3px solid var(--blue);padding-left:12px}.group-head.dim{color:#adb5c0}.group-icon{font-size:18px;width:20px;text-align:center}.chev{margin-left:auto;color:#7c8a9c;font-size:12px}.subnav{margin-left:26px;padding:10px 0 4px 10px;border-left:1px solid #e7ebf0}.group-label{font-size:10px;color:#a5aeb8;margin:10px 0 7px 1px}.nav-link{border:0;background:transparent;width:100%;height:38px;text-align:left;padding:0 10px;display:flex;align-items:center;justify-content:space-between;border-radius:7px;color:#596678;font-size:12px}.nav-link:hover{background:#f5f7fa}.nav-link.active{color:#304d75;background:#f7f9fc;border:1px solid #e6ebf3;font-weight:700}.nav-link small{font-size:9px;color:#7890ac;letter-spacing:.06em}.main{min-width:0;flex:1;padding:28px 30px 60px;max-width:1800px;margin:auto}.topline,.filterbar,.panel,.metric,.notice{background:white;border:1px solid var(--line);box-shadow:0 2px 8px rgba(37,56,83,.025)}.topline{border-radius:11px;padding:11px 18px;display:flex;align-items:center;gap:14px;color:#758399;font-size:11px;min-height:47px}.topline .spacer{flex:1}.pill{display:inline-flex;align-items:center;gap:4px;border-radius:14px;padding:4px 9px;background:#f0f3f7;color:#687b94;font-size:10px;font-weight:650;white-space:nowrap}.topline strong{color:#293a52}.filterbar{margin:9px 0 22px;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}.filterbar .filter-label{font-size:12px;color:#97a2ae;margin-right:8px}.filterbar button,.seg button,.small-btn,.tab-buttons button{border:1px solid #e9edf2;background:#fafbfd;color:#59677a;border-radius:7px;padding:8px 12px;font-size:11px;white-space:nowrap}.filterbar button:hover,.seg button:hover,.small-btn:hover,.tab-buttons button:hover{border-color:#c7d3e1}.filterbar button.active,.seg button.active,.tab-buttons button.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 10px #d3deeb}.section-title{font-weight:750;font-size:15px;display:flex;align-items:center;gap:8px;margin:24px 0 14px}.section-title:before{content:"";width:3px;height:17px;border-radius:3px;background:var(--blue)}.section-title span{font-size:11px;font-weight:400;color:#9aa6b3}.section-title em{font-style:normal;color:#d19b56;background:#fff4e7;border-radius:10px;padding:3px 8px;font-size:10px;font-weight:650}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.metrics.cols5{grid-template-columns:repeat(5,minmax(0,1fr))}.metric{border-radius:14px;min-height:118px;padding:18px 19px;position:relative}.metric.highlight{background:linear-gradient(125deg,#54749e,#7e9bc0);color:#fff;border-color:#6c8bb4}.metric .label{font-size:11px;color:#7d8998}.metric.highlight .label,.metric.highlight .sub{color:#ebf2fb}.metric .value{font-size:27px;font-weight:760;letter-spacing:-.025em;margin:11px 0 4px}.metric .sub{font-size:10px;color:#9aa5b1;line-height:1.5}.metric .badge{position:absolute;right:12px;top:12px}.metric .value.blue{color:var(--blue)}.notice{border-radius:8px;padding:11px 14px;color:#667891;font-size:11px;margin:20px 0;line-height:1.65}.notice b{color:var(--blue);margin-right:5px}.notice.warn{background:#fffaf0;border-left:3px solid #efbd76}.panel{border-radius:15px;padding:18px;margin:13px 0}.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:17px}.panel-head h3{font-size:14px;margin:0}.panel-head .sub{color:#a4aebb;font-size:10px}.panel-head .spacer{flex:1}.chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.chart-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-panel{min-width:0}.chart-title{font-size:13px;font-weight:700;margin:0 0 12px}.chart-title small{float:right;font-size:10px;font-weight:400;color:#a4afbc}.chart{height:226px;position:relative}.chart svg{width:100%;height:100%;overflow:visible}.chart .gridline{stroke:#e8edf2;stroke-width:1}.chart .axis{font-size:9px;fill:#9aa7b6}.chart .bar{fill:#5a7caf}.chart .bar.alt{fill:#e6a15b}.chart .bar.soft{fill:#a6b9d4}.chart .line{fill:none;stroke:var(--blue);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.chart .line.orange{stroke:#e5a467}.chart .area{fill:#5a7caf;opacity:.08}.mini-legend{display:flex;justify-content:center;gap:14px;color:#7f8fa0;font-size:10px;margin-top:8px}.dot{display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--blue);margin-right:4px}.dot.orange{background:var(--orange)}.goal-panel{padding:0}.goal-title{padding:18px;border-bottom:1px solid #edf0f4;font-size:14px;font-weight:700}.goal-controls{padding:16px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.seg{display:inline-flex;gap:4px;background:#f9fafc;border:1px solid #edf0f4;border-radius:9px;padding:4px}.goal-controls .spacer{flex:1}.goal-controls label{font-size:11px;color:#7e8b9a}.goal-controls input,.search-input,select{height:34px;border:1px solid #e6ebf1;border-radius:7px;padding:0 10px;background:#fff;color:#34445b;outline:none}.goal-controls input{width:90px;font-weight:700}.primary{background:var(--blue)!important;color:white!important;border-color:var(--blue)!important}.goal-result{padding:2px 18px 18px;display:grid;grid-template-columns:1.15fr 1fr;gap:14px}.goal-box{border:1px solid #edf0f4;border-radius:11px;padding:16px}.goal-number{font-size:29px;color:#3d5f89;font-weight:760;margin:10px 0}.progress{height:9px;background:#e8edf3;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#5679a8,#8fabc9);border-radius:8px}.goal-stats{display:flex;gap:25px;margin-top:14px}.goal-stats div{font-size:10px;color:#94a0ae}.goal-stats b{display:block;font-size:18px;color:#344b69;margin-top:4px}.table-wrap{overflow:auto;max-height:485px}.data-table{border-collapse:collapse;width:100%;font-size:11px;white-space:nowrap}.data-table th{background:#f6f8fb;color:#66768a;font-weight:650;text-align:left;position:sticky;top:0;z-index:1}.data-table th,.data-table td{padding:12px 14px;border-bottom:1px solid #edf1f5}.data-table tr:hover td{background:#fafbfd}.data-table th.sortable{cursor:pointer}.rank{color:#5174a4;font-weight:750}.table-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}.table-toolbar .spacer{flex:1}.search-input{width:250px;font-size:11px}.status{font-size:10px;border-radius:4px;padding:4px 7px;background:#eff4f9;color:#55749d}.status.good{background:#edf7ef;color:#64936d}.wordcloud{height:260px;display:flex;align-content:center;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px 14px;overflow:hidden;padding:14px;background:#fbfcfe;border:1px solid #edf0f4;border-radius:9px}.wordcloud span{font-weight:700;line-height:1.2}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature-card{border:1px solid #e8edf3;border-left:3px solid var(--blue);padding:17px;border-radius:10px}.feature-card b{font-size:26px;display:block;margin:8px 0}.feature-card small{color:#9ba6b2}.empty{height:170px;display:grid;place-items:center;color:#98a5b4;background:#fbfcfe;border:1px dashed #dfe6ef;border-radius:10px;font-size:12px}.demo-flag{position:fixed;right:16px;bottom:15px;padding:8px 13px;border-radius:20px;background:#354f73;color:white;box-shadow:0 5px 18px #8292a9a8;font-size:11px;z-index:10}.mobile-menu{display:none}.toast{position:fixed;bottom:55px;left:50%;transform:translateX(-50%);background:#26384f;color:white;padding:9px 15px;border-radius:8px;display:none;z-index:20;font-size:12px}
    @media(max-width:1120px){.metrics,.metrics.cols5{grid-template-columns:repeat(2,minmax(0,1fr))}.chart-grid{grid-template-columns:1fr 1fr}.sidebar{width:190px}.main{padding:20px}}
    @media(max-width:720px){.mobile-menu{display:block;position:fixed;top:13px;left:13px;z-index:30;border:0;border-radius:8px;background:var(--blue);color:#fff;padding:8px 10px}.sidebar{position:fixed;z-index:25;transform:translateX(-100%);transition:transform .2s;width:225px;box-shadow:10px 0 25px #cad2dc80}.sidebar.open{transform:translateX(0)}.main{padding:55px 12px 60px}.topline{flex-wrap:wrap}.metrics,.metrics.cols5,.chart-grid,.chart-grid.two,.goal-result,.feature-grid{grid-template-columns:1fr}.filterbar{gap:5px}.metric{min-height:100px}.chart{height:200px}.demo-flag{right:8px;bottom:8px}}

<body>
  <button class="mobile-menu" id="menuBtn" aria-label="打开导航">☰</button>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><div class="brand-mark">UG</div><div><div class="brand-title">用增工作台</div><div class="brand-en">User Growth<br>Workbench</div></div></div>

    </aside>
    <main class="main">
      <div id="topline" class="topline"><span class="pill">演示数据 · 不连接内部系统</span><span>归因口径 · 10日浏览 × 商家匹配</span><span>|</span><span>覆盖活动 <strong>12 个演示活动</strong></span><span class="spacer"></span><span>数据范围 · 2026-04-25 ~ 2026-11-08</span></div>
      <div id="filterbar" class="filterbar"><span class="filter-label">活动视角</span></div>
      <div id="view"></div>
    </main>
  </div>
  <div class="demo-flag">界面复刻演示 · 全部数值为合成数据</div><div class="toast" id="toast"></div>
  <script>
    // All figures below are synthetic examples for the public demo.
    const activities=[
      {name:"宝藏店铺计划",gmv:18520000,orders:87300,buyers:42100,notes:3180,newBuyers:9820,cost:96300},
      {name:"创作者灵感季",gmv:16140000,orders:76900,buyers:37600,notes:2900,newBuyers:8600,cost:88400},
      {name:"秋日好物手册",gmv:12490000,orders:60100,buyers:29400,notes:2150,newBuyers:6210,cost:64200},
      {name:"城市生活提案",gmv:10870000,orders:54700,buyers:25700,notes:1880,newBuyers:5710,cost:56100},
      {name:"我的购物清单",gmv:9670000,orders:46900,buyers:22600,notes:1730,newBuyers:4980,cost:51800},
      {name:"周末逛逛市集",gmv:8220000,orders:39000,buyers:18100,notes:1490,newBuyers:3920,cost:43200},
      {name:"心动礼物指南",gmv:6880000,orders:33100,buyers:15400,notes:1160,newBuyers:3290,cost:38500},
      {name:"冬日穿搭征集",gmv:5310000,orders:25800,buyers:12000,notes:940,newBuyers:2540,cost:32700},
      {name:"小预算好物局",gmv:4120000,orders:20700,buyers:9600,notes:790,newBuyers:1960,cost:26100},
      {name:"居家焕新计划",gmv:3660000,orders:18300,buyers:8500,notes:680,newBuyers:1720,cost:23200},
      {name:"好物开箱日记",gmv:2470000,orders:12500,buyers:5900,notes:460,newBuyers:1080,cost:16800},
      {name:"周边宝藏发现",gmv:1420000,orders:7300,buyers:3400,notes:270,newBuyers:620,cost:10400}
    ];
    const short=n=>n>=1e8?'¥'+(n/1e8).toFixed(2)+'亿':n>=1e4?'¥'+(n/1e4).toFixed(1)+'万':'¥'+Math.round(n).toLocaleString();
    const num=n=>Math.round(n).toLocaleString('zh-CN');
    const state={page:location.hash.slice(1)||'home',activity:-1,period:'近7日',goal:12000,sort:'gmv',desc:true,query:'',chartMode:'归因新客'};
    const el=id=>document.getElementById(id);
    const selected=()=>state.activity<0?activities:activities.filter((_,i)=>i===state.activity);
    const sum=(items,key)=>items.reduce((a,x)=>a+x[key],0);
    function metric(label,value,sub='',highlight=false,badge='累计'){return `<div class="metric ${highlight?'highlight':''}"><span class="label">${label}</span><span class="pill badge">${badge}</span><div class="value">${value}</div><div class="sub">${sub}</div></div>`}
    function heading(title,sub='',tag=''){return `<div class="section-title">${title}<span>${sub}</span>${tag?`<em>${tag}</em>`:''}</div>`}
    function notice(text,warn=false){return `<div class="notice ${warn?'warn':''}"><b>ⓘ</b> ${text}</div>`}
    function panel(title,body,sub='',right=''){return `<section class="panel"><div class="panel-head"><h3>${title}</h3><span class="sub">${sub}</span><span class="spacer"></span>${right}</div>${body}</section>`}
    function bars(values,labels,alt=false){let max=Math.max(...values)*1.15;return `<div class="chart"><svg viewBox="0 0 400 220" preserveAspectRatio="none" aria-label="柱状图">${[0,1,2,3].map(i=>`<line class="gridline" x1="34" x2="395" y1="${25+i*48}" y2="${25+i*48}"/>`).join('')}${values.map((v,i)=>{let h=145*v/max;return `<rect class="bar ${alt&&i%2?'alt':''}" x="${45+i*344/values.length}" y="${170-h}" width="${Math.max(9,310/values.length-7)}" height="${h}" rx="4"/><text class="axis" x="${47+i*344/values.length}" y="193" transform="rotate(-25 ${47+i*344/values.length} 193)">${labels[i]||''}</text>`}).join('')}</svg></div>`}
    function line(values,orange=false){let max=Math.max(...values)*1.2,min=Math.min(...values)*.75,pts=values.map((v,i)=>[36+i*350/(values.length-1),170-(v-min)/(max-min)*135]);return `<div class="chart"><svg viewBox="0 0 400 220" preserveAspectRatio="none" aria-label="趋势折线图">${[0,1,2,3].map(i=>`<line class="gridline" x1="34" x2="395" y1="${25+i*48}" y2="${25+i*48}"/>`).join('')}<polyline class="line ${orange?'orange':''}" points="${pts.map(p=>p.join(',')).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="${orange?'#e5a467':'#53739f'}"/><text class="axis" x="${p[0]-6}" y="194">${i+1}</text>`).join('')}</svg></div>`}
    function chartCard(title,body,sub=''){return `<div class="panel chart-panel"><h3 class="chart-title">${title}<small>${sub}</small></h3>${body}</div>`}
    function activityTable(items=selected(),limit=12){let rows=[...items].sort((a,b)=>state.desc?b[state.sort]-a[state.sort]:a[state.sort]-b[state.sort]).slice(0,limit);return `<div class="table-wrap"><table class="data-table"><thead><tr><th>活动</th><th class="sortable" data-sort="gmv">归因DGMV ↕</th><th class="sortable" data-sort="orders">订单数 ↕</th><th class="sortable" data-sort="buyers">买家数 ↕</th><th class="sortable" data-sort="newBuyers">新客数 ↕</th><th>成交笔记数</th><th>新客占比</th></tr></thead><tbody>${rows.map((x,i)=>`<tr><td><span class="rank">${i+1}.</span> ${x.name}</td><td><b>${short(x.gmv)}</b></td><td>${num(x.orders)}</td><td>${num(x.buyers)}</td><td>${num(x.newBuyers)}</td><td>${num(x.notes)}</td><td>${(100*x.newBuyers/x.buyers).toFixed(1)}%</td></tr>`).join('')}</tbody></table></div>`}
    function renderHome(){let a=selected(),gmv=sum(a,'gmv'),orders=sum(a,'orders'),buyers=sum(a,'buyers'),newBuyers=sum(a,'newBuyers'),notes=sum(a,'notes'),cost=sum(a,'cost');return `
      ${heading('北极星指标','拉新最终效果 · 10日浏览×商家匹配归因')}
      <div class="metrics">${metric('P0-MAB',num(Math.round(buyers*.39)),'占 MAB 39.0% · 驱动新客增长',true,'近30天')}${metric('新客数及占比',num(newBuyers)+'  '+(newBuyers/buyers*100).toFixed(1)+'%','新客DGMV '+short(gmv*.085),false,'近30天')}${metric('MAB',num(buyers),'滚动30日去重买家数',false,'近30天')}${metric('DGMV',short(gmv),'客单价 '+short(gmv/orders),false,'累计至今')}${metric('成交订单数',num(orders),'平均订单价 '+short(gmv/orders),false,'累计至今')}${metric('新客用户数',num(newBuyers),'广义新用户 · 占总买家 '+(newBuyers/buyers*100).toFixed(1)+'%',false,'累计至今')}${metric('近7日新客用户数',num(Math.round(newBuyers*.15)),'周目标完成情况见下方',false,'近7日')}</div>

    function renderFunc(){return `${heading('产品功能 · 晒单链路入口点位趋势','曝光/点击 PV、UV 与 CTR 双口径')}${panel('总览 · 按钮总点击',`<div class="feature-grid"><div class="feature-card"><small>「晒单」按钮 · 总点击</small><b>81,420 <span style="font-size:12px;color:#8496aa">PV</span></b><small>列表页和详情页合并 · 合成数据</small></div><div class="feature-card"><small>「晒单有礼」按钮 · 总点击</small><b>142,360 <span style="font-size:12px;color:#8496aa">PV</span></b><small>列表页与详情页合并</small></div><div class="feature-card"><small>落地页 · 发笔按钮总点击</small><b>86,910 <span style="font-size:12px;color:#8496aa">PV</span></b><small>日均约 12,416</small></div></div>`,'演示周期 2026-10-26 ~ 11-01')}${panel('一、订单列表页 · 晒单 / 晒单有礼入口',`<div class="metrics cols5" style="margin-bottom:15px">${metric('晒单·曝光PV','2,410万','近7日均')}${metric('晒单·曝光UV','365万','近7日均')}${metric('晒单·点击PV','7,840','近7日均')}${metric('晒单·点击UV','6,360','近7日均')}${metric('晒单·CTR','0.0325%','PV口径')}</div>${line([40,42,39,44,46,45,48,53,50,56,59,60])}`)}${panel('二、商品详情页 · 晒单入口',`<div class="metrics">${metric('详情页曝光PV','1,260万','近7日')}${metric('详情页点击PV','4,750','近7日')}${metric('详情页CTR','0.0377%','PV口径')}</div>`)}`}
    const renderers={home:renderHome,content:renderContent,deal:renderDeal,note:renderNote,host:renderHost,hot:renderHot,ads:renderAds,anomaly:renderAnomaly,haul:renderHaul,func:renderFunc};
    function renderFilters(){const filters=['整体',...activities.slice(0,5).map(x=>x.name)];el('filterbar').innerHTML='<span class="filter-label">活动视角</span>'+filters.map((x,i)=>`<button data-activity="${i-1}" class="${state.activity===i-1?'active':''}">${i>0?'□ ':''}${x}</button>`).join('')+`<select id="moreActivities" aria-label="更多活动" style="font-size:11px;max-width:180px"><option value="">${state.activity>=5?activities[state.activity].name:'更多活动 +7 ▾'}</option>${activities.slice(5).map((x,i)=>`<option value="${i+5}">${x.name}</option>`).join('')}</select>`}
    function render(){if(!renderers[state.page])state.page='home';document.querySelectorAll('.nav-link').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));renderFilters();el('view').innerHTML=renderers[state.page]();document.title='用增工作台 · '+(document.querySelector('.nav-link.active')?.textContent.trim()||'内容拉新')+'｜演示版'}
    function toast(msg){let t=el('toast');t.textContent=msg;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2200)}
    document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;
      if(b.dataset.page){state.page=b.dataset.page;location.hash=state.page;state.query='';el('sidebar').classList.remove('open');render();scrollTo(0,0)}
      else if(b.dataset.activity!==undefined){state.activity=Number(b.dataset.activity);render()}
      else if(b.dataset.period){state.period=b.dataset.period;render()}
      else if(b.id==='goalBtn'){state.goal=Math.max(1,Number(el('goalInput').value)||12000);render();toast('目标已更新')}
      else if(b.dataset.sort){if(state.sort===b.dataset.sort)state.desc=!state.desc;else{state.sort=b.dataset.sort;state.desc=true}render()}
      else if(b.id==='noteSearch'){state.query=el('noteQuery').value.trim();render()}
      else if(b.id==='noteReset'){state.query='';render()}
      else if(b.id==='csvBtn'){const rows=[['活动','DGMV','订单数','买家数','新客数'],...selected().map(x=>[x.name,x.gmv,x.orders,x.buyers,x.newBuyers])];const csv='\ufeff'+rows.map(r=>r.join(',')).join('\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='内容拉新演示数据.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
      else if(b.id==='anomalyApply'||b.id==='hotSearch'||b.id==='hostSearch')toast('已更新演示筛选');
      else if(b.dataset.hot||b.dataset.chartmode||b.dataset.anomalyPeriod){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active')}
    });
    document.addEventListener('change',e=>{if(e.target.id==='moreActivities'&&e.target.value!==''){state.activity=Number(e.target.value);render()}});
    el('menuBtn').addEventListener('click',()=>el('sidebar').classList.toggle('open'));
    window.addEventListener('hashchange',()=>{state.page=location.hash.slice(1)||'home';render()});
    render();
  </script>
</body>
</html>
